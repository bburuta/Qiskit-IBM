# qGAN generated one-run convergence battery.
#
# Auto-generated from train_conv_cpu.yaml for an unfinished run.
# Original run id is preserved so checkpointed training can resume.

default_config_values:
  implementation:
    name: qml_torch
    discriminator_packing: separate
  run:
    id: null
    label: null
    data_path: qgan/data/train
    seed: 0
    device: CPU
  experiment:
    implementation: ang
    execution_type: noiseless
    n_qubits: 4
    gradient_method: SPSA
  training:
    max_iterations: 1000
    gen_iterations: 1
    disc_iterations: 1
    init_scale: 0.1
    learning_rate: 0.005
    print_every: 100
    checkpoint_every: 100
  dataset:
    id: null
    reset: false
    type: classical
    source: generated_gradients
    parameters: {}
  circuits:
    reset: false
    generator: real_amplitudes
    discriminator: efficient_su2
  backend:
    reset: false
    save_backend_file: false
    precision: 0.015625
    transpilation:
      optimization_level: 3
      layout_method: sabre
      routing_method: sabre
    simulator:
      device: CPU
      data_type: double
      noiseless_method: statevector
      noisy_method: density_matrix
      noisy_backend_mapping: hardware
      max_parallel_threads: 0
      max_parallel_experiments: 1
      max_parallel_shots: 0
      gpu:
        cuStateVec_enable: true
        batched_shots_gpu: false
        blocking_enable: false
        runtime_parameter_bind_enable: false
    real:
      id: null
      name: ibm_basquecountry
      info_storage: shared
      reset_info: false
      confirm_runtime_execution: false
      estimator:
        resilience_level: 1
        dynamical_decoupling:
          enable: true
  encoding:
    type: angle
    contrast: 1
    random_circuit: 1
    randomness: 0
    batch_size: 4
    eval_batch_size: 8
    max_parallel_threads: 1
    eval_method: gradient
variable_config_values_list:
  remaining_run:
    implementation.name:
    - qml_torch
    implementation.discriminator_packing:
    - separate
    experiment.implementation:
    - ang
    experiment.execution_type:
    - noiseless
    experiment.gradient_method:
    - PSR
    experiment.n_qubits:
    - 16
    backend.simulator.device:
    - CPU
    run.seed:
    - 2
    encoding.randomness:
    - 0
