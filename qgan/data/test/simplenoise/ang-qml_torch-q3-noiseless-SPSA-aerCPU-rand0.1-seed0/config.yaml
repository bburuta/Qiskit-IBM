implementation:
  name: qml_torch
  discriminator_packing: separate
run:
  id: ang-qml_torch-q3-noiseless-SPSA-aerCPU-rand0.1-seed0
  data_path: qgan/data/test/simplenoise
  seed: 0
  device: CPU
experiment:
  implementation: ang
  execution_type: noiseless
  n_qubits: 3
  gradient_method: SPSA
training:
  max_iterations: 2
  gen_iterations: 1
  disc_iterations: 1
  init_scale: 0.1
  learning_rate: 0.005
  print_every: 1
dataset:
  id: generated_gradients-total_pixels3
  reset: false
  type: classical
  source: generated_gradients
  parameters:
    total_pixels: 3
circuits:
  reset: false
  generator: real_amplitudes
  discriminator: efficient_su2
backend:
  reset: false
  precision: 0.5
  transpilation:
    optimization_level: 1
    layout_method: trivial
    routing_method: basic
  simulator:
    device: CPU
    data_type: double
    noiseless_method: statevector
    noisy_method: statevector
    noisy_backend_mapping: noise_model
    max_parallel_threads: 0
    max_parallel_experiments: 1
    max_parallel_shots: 0
    gpu:
      cuStateVec_enable: true
      batched_shots_gpu: false
      blocking_enable: false
      runtime_parameter_bind_enable: true
  real:
    id: ibm_basquecountry
    name: ibm_basquecountry
    channel: ibm_quantum_platform
    reset_info: false
    estimator:
      resilience_level: 1
      dynamical_decoupling:
        enable: true
encoding:
  type: angle
  contrast: 1
  randomness: 0.1
  batch_size: 2
  eval_batch_size: 2
  max_parallel_threads: 1
  eval_method: gradient
