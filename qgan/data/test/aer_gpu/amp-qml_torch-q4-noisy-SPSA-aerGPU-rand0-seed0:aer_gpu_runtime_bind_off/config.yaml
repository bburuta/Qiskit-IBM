implementation:
  name: qml_torch
  discriminator_packing: separate
run:
  id: amp-qml_torch-q4-noisy-SPSA-aerGPU-rand0-seed0:aer_gpu_runtime_bind_off
  label: aer_gpu_runtime_bind_off
  data_path: qgan/data/test/aer_gpu
  seed: 0
  device: CPU
experiment:
  implementation: amp
  execution_type: noisy
  n_qubits: 4
  gradient_method: SPSA
training:
  max_iterations: 2
  gen_iterations: 1
  disc_iterations: 1
  init_scale: 0.1
  learning_rate: 0.005
  print_every: 1
dataset:
  id: generated_gradients-total_pixels16
  reset: false
  type: classical
  source: generated_gradients
  parameters:
    total_pixels: 16
circuits:
  reset: false
  generator: real_amplitudes
  discriminator: efficient_su2
backend:
  reset: false
  precision: 0.03125
  transpilation:
    optimization_level: 3
    layout_method: sabre
    routing_method: sabre
  simulator:
    device: GPU
    data_type: double
    noiseless_method: statevector
    noisy_method: density_matrix
    noisy_backend_mapping: hardware
    max_parallel_threads: 0
    max_parallel_experiments: 1
    max_parallel_shots: 0
    gpu:
      cuStateVec_enable: true
      batched_shots_gpu: false
      blocking_enable: false
      runtime_parameter_bind_enable: false
  real:
    id: ibm_basquecountry
    name: ibm_basquecountry
    channel: ibm_quantum_platform
    reset_info: false
    confirm_execution: true
    estimator:
      resilience_level: 1
      dynamical_decoupling:
        enable: true
encoding:
  type: amplitude
  contrast: 1
  randomness: 0
  batch_size: 4
  eval_batch_size: 8
  max_parallel_threads: 1
  eval_method: gradient
