implementation:
  name: qml_torch
  discriminator_packing: separate
run:
  id: base-qml_torch-q3-noisy-PSR-aerGPU-rand0-seed0
  label: null
  data_path: qgan/data/test/simplegpu
  seed: 0
  device: CPU
experiment:
  implementation: base
  execution_type: noisy
  n_qubits: 3
  gradient_method: PSR
training:
  max_iterations: 2
  gen_iterations: 1
  disc_iterations: 1
  init_scale: 0.1
