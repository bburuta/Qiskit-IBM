implementation:
  name: qml_torch
run:
  id: ang-qml_torch-q3-noiseless-REG-CPU-seed0
  data_path: qgan/data/test
  seed: 0
  device: CPU
experiment:
  implementation: ang
  execution_type: noiseless
  n_qubits: 3
  gradient_method: REG
training:
  max_iterations: 2
  gen_iterations: 1
  disc_iterations: 1
  print_every: 1
dataset:
  id: generated_gradients-total_pixels3
  reset: false
  type: classical
  source: generated_gradients
  parameters:
    total_pixels: 3
circuits:
  reset: false
  generator: real_amplitudes
  discriminator: efficient_su2
backend:
  reset: false
  precision: 0.5
  simulator:
    data_type: double
    noiseless_method: statevector
    noisy_method: statevector
    noisy_backend_mapping: noise_model
    gpu:
      cuStateVec_enable: true
      batched_shots_gpu: true
      blocking_enable: false
      runtime_parameter_bind_enable: true
  real:
    id: ibm_basquecountry
    name: ibm_basquecountry
    channel: ibm_quantum_platform
    reset_info: false
    estimator:
      resilience_level: 1
      dynamical_decoupling:
        enable: true
encoding:
  type: angle
  contrast: 1
  randomness: 0.1
  batch_size: 2
  eval_batch_size: 2
  max_parallel_threads: 1
  eval_method: gradient
